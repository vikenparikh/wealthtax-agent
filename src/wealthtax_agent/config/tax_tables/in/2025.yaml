# India tax tables for AY 2025-26 (FY 2024-25). Prototype only.
# Reflects Finance (No.2) Act 2024 changes — Jul 23 2024 capital-gains rule change.
year: 2025
currency: INR

# New regime (default; Budget 2024 revisions)
new_regime:
  brackets:
    - {up_to: 300000,  rate: 0.00}
    - {up_to: 700000,  rate: 0.05}
    - {up_to: 1000000, rate: 0.10}
    - {up_to: 1200000, rate: 0.15}
    - {up_to: 1500000, rate: 0.20}
    - {up_to: null,    rate: 0.30}
  standard_deduction_salary: 75000      # Budget 2024 bumped this
  rebate_87a:
    income_threshold: 700000
    max_credit: 25000

# Old regime (unchanged)
old_regime:
  brackets:
    - {up_to: 250000,  rate: 0.00}
    - {up_to: 500000,  rate: 0.05}
    - {up_to: 1000000, rate: 0.20}
    - {up_to: null,    rate: 0.30}
  brackets_senior_60_to_80:
    - {up_to: 300000,  rate: 0.00}
    - {up_to: 500000,  rate: 0.05}
    - {up_to: 1000000, rate: 0.20}
    - {up_to: null,    rate: 0.30}
  brackets_super_senior_80_plus:
    - {up_to: 500000,  rate: 0.00}
    - {up_to: 1000000, rate: 0.20}
    - {up_to: null,    rate: 0.30}
  standard_deduction_salary: 50000
  rebate_87a:
    income_threshold: 500000
    max_credit: 12500

surcharge:
  - {income_above: 5000000,  rate: 0.10}
  - {income_above: 10000000, rate: 0.15}
  - {income_above: 20000000, rate: 0.25}
  - {income_above: 50000000, rate: 0.37}
surcharge_new_regime_cap: 0.25
# Surcharge on the tax from §111A/§112/§112A capital gains is capped at 15%
# regardless of the total-income tier (Finance Act Part I proviso).
surcharge_capital_gains_cap: 0.15

cess_rate: 0.04

deductions:
  section_80c_cap: 150000
  section_80ccd_1b_nps_cap: 50000
  section_80d_self_under_60: 25000
  section_80d_self_senior_60_plus: 50000
  section_80d_parents_under_60: 25000
  section_80d_parents_senior_60_plus: 50000
  section_80tta_savings_interest_cap: 10000
  section_80ttb_senior_interest_cap: 50000
  section_80e_education_loan_cap: null
  section_24b_home_loan_self_occupied: 200000
  section_80g_percent_default: 0.50
  section_80ggc_percent: 1.00                # §80GGC political donation: 100%, no cap, no sunset (non-cash)
  # §57(iia) standard deduction on family pension: lower of 1/3 or the cap.
  # AY 2025-26 — old regime ₹15,000; new regime raised to ₹25,000 (Budget 2024).
  section_57_family_pension_old: 15000
  section_57_family_pension_new: 25000
  # §80GG rent-paid-with-no-HRA: least of ₹5,000/mo, 25% of income, rent − 10% of income.
  section_80gg:
    monthly_cap: 5000
    income_pct: 0.25
    rent_excess_pct: 0.10
  # §80U (own) / §80DD (dependent) flat disability deductions — unchanged since AY 2016-17.
  section_80u_80dd:
    normal: 75000     # disability >= 40%
    severe: 125000    # severe disability >= 80%
  # §80DDB medical-treatment-of-specified-diseases cap (actual expense up to).
  section_80ddb:
    under_60: 40000
    senior_60_plus: 100000
  # §80EEB electric-vehicle loan interest cap (per year).
  section_80eeb:
    cap: 150000

# Capital gains regime change effective Jul 23 2024.
# Pre-change rates apply to transfers before that date; post-change rates after.
capital_gains:
  regime_change_date: "2024-07-23"
  pre_change:
    ltcg_equity_threshold: 100000
    ltcg_equity_rate: 0.10
    stcg_equity_rate: 0.15
    ltcg_other_rate: 0.20
    stcg_other_taxed_at_slab: true
  post_change:
    ltcg_equity_threshold: 125000     # bumped to 1.25 lakh
    ltcg_equity_rate: 0.125
    stcg_equity_rate: 0.20            # bumped from 15% to 20%
    ltcg_other_rate: 0.125            # without indexation post-change
    stcg_other_taxed_at_slab: true

hra:
  metro_pct: 0.50
  non_metro_pct: 0.40
  cities_metro: ["Delhi", "Mumbai", "Kolkata", "Chennai"]
