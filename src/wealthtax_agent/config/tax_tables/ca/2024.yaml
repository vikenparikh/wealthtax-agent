# Canada federal tax table for the 2024 tax year (filed in 2025).
# Source-shaped after CRA publications. Approximate; prototype only.
year: 2024
currency: CAD
brackets:
  - {up_to: 55867,  rate: 0.15}
  - {up_to: 111733, rate: 0.205}
  - {up_to: 173205, rate: 0.26}
  - {up_to: 246752, rate: 0.29}
  - {up_to: null,   rate: 0.33}

basic_personal_amount: 15705
# Federal BPA phases down to this floor for high net income (between the
# bottom of the 29% bracket and the bottom of the 33% bracket).
basic_personal_amount_min: 14156

# CPP/EI 2024 employee maximums (simplified)
cpp:
  ympe: 68500
  basic_exemption: 3500
  rate: 0.0595
  max_contribution: 3867.50
ei:
  max_insurable_earnings: 63200
  rate: 0.0166
  max_contribution: 1049.12

# Age amount (federal line 30100): 65+ credit, reduced by 15% of net income
# over the threshold and fully phased out above it.
# OAS recovery tax (clawback) threshold — indexed annually.
oas_recovery_threshold: 90997
# Canada Workers Benefit (Schedule 6), FEDERAL basic amount only. Excludes the
# disability supplement, provincial AB/QC/NU reconfigurations, and true family
# AFNI (spousal income is not modelled). Single-filer is the high-value path.
cwb:
  phase_in_rate: 0.27
  working_income_floor: 3000
  max_single: 1518
  max_family: 2616
  phaseout_threshold_single: 26149
  phaseout_threshold_family: 29833
  phaseout_rate: 0.15
age_amount:
  maximum: 8790
  net_income_threshold: 44325
  reduction_rate: 0.15
# Dividend tax credit (federal). Gross-up applied separately by engine.
dividend:
  eligible:
    gross_up: 0.38
    federal_credit_rate: 0.150198
  non_eligible:
    gross_up: 0.15
    federal_credit_rate: 0.090301

capital_gains_inclusion_rate: 0.5

rrsp:
  contribution_limit_percent: 0.18
  annual_dollar_limit: 31560

# Simplified employment credit (Canada Employment Amount)
canada_employment_amount: 1433

# Multigenerational Home Renovation Tax Credit (MHRTC, s.122.92, line 45355) —
# refundable, fixed non-indexed (effective 2023).
mhrtc:
  rate: 0.15
  expenditure_cap: 50000

# Federal Quebec abatement (ITA s.120(2), line 44000): 16.5% of basic federal
# tax for Quebec residents. Long-standing, non-indexed.
quebec_abatement_rate: 0.165
