basic_personal_amount: 12399
# Ontario charitable-donation credit excess rate (donations over $200); the
# first $200 uses the lowest bracket rate. Drives the provincial donation
# credit at provincial rates instead of the federal amount.
donation_credit_high_rate: 0.1116
# Ontario dividend tax credit (decimal of grossed-up amount)
dividend:
  eligible: 0.10
  non_eligible: 0.029863

# Ontario surtax (ON428): 20% over the first threshold + 36% over the second,
# on basic provincial tax after non-refundable credits. Rates fixed; thresholds
# indexed (2024 values).
surtax:
  - {threshold: 5554, rate: 0.20}
  - {threshold: 7108, rate: 0.36}
