# Alternative Minimum Tax (Form 6251) — indexed annually. Exemption and
# phaseout vary by filing status; the 26%/28% rate breakpoint is single-valued
# (the engine does not model MFS, whose breakpoint is half).
# Federal poverty line (48 contiguous states + DC) for the Premium Tax Credit.
# A coverage year uses the PRIOR calendar year's HHS guidelines (2024 guidelines).
fpl:
  one_person: 15060
  additional_person: 5380
# Premium Tax Credit applicable-figure schedule (Form 8962 Table 2).
# ARPA/IRA enhanced, identical for 2021-2025 (only the FPL base dollars are
# indexed). [fpl_ratio, applicable_pct] anchors; linear interpolation between,
# 0 below the first, flat at cap at/above the last (no 400% cliff through 2025).
ptc:
  applicable_figure:
    - [1.50, 0.000]
    - [2.00, 0.020]
    - [2.50, 0.040]
    - [3.00, 0.060]
    - [4.00, 0.085]
  cap_applicable_pct: 0.085
# Education credits (Form 8863): American Opportunity (AOTC) + Lifetime
# Learning (LLC). Phase-outs are statutory/fixed (§25A(d)), not indexed.
education_credits:
  aotc_max: 2500
  aotc_100pct_threshold: 2000
  aotc_25pct_threshold: 2000
  aotc_refundable_pct: 0.40
  llc_rate: 0.20
  llc_expense_cap: 10000
  phaseout_start_single: 80000
  phaseout_end_single: 90000
  phaseout_start_mfj: 160000
  phaseout_end_mfj: 180000
# Form 2441 Child & Dependent Care Credit — fixed-statutory (§21), not indexed.
dependent_care:
  expense_cap_per_person: 3000
  max_qualifying_persons: 2
  dcb_exclusion_max: 5000
  max_rate: 0.35
  min_rate: 0.20
  rate_phasedown_agi_floor: 15000
  rate_phasedown_step_agi: 2000
# Form 5695 Residential Energy Credits — fixed-statutory (§25D/§25C, IRA-2022, non-indexed through 2032).
