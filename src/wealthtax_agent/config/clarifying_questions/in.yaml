questions:
  - id: in_regime
    prompt: "Old or new tax regime? (auto = pick whichever costs less)"
    why_it_matters: "Old regime allows 80C/80D/HRA/Section 24(b); new regime has lower slabs and a 75k standard deduction."
    answer_type: choice
    options: [auto, new, old]
    priority: high
  - id: age
    prompt: "How old were you on the last day of the financial year?"
    why_it_matters: "Senior (60+) and super-senior (80+) have higher exemption thresholds and 80TTB instead of 80TTA."
    answer_type: number
    priority: high
  - id: city_of_residence
    prompt: "Which Indian city did you live in (for HRA exemption)?"
    why_it_matters: "Metro cities (Delhi, Mumbai, Kolkata, Chennai) get 50% HRA exemption; non-metros 40%."
    answer_type: text
    priority: medium
  - id: annual_rent_paid
    prompt: "How much annual rent did you pay?"
    why_it_matters: "Required for the HRA exemption calculation (old regime only)."
    answer_type: number
    priority: medium
  - id: section_80c_ppf
    prompt: "PPF / NSC / 5-year tax-saving FD / Sukanya Samriddhi contributions this year (do NOT include EPF, LIC, home-loan principal, or ELSS — those have their own questions)?"
    why_it_matters: "Section 80C deduction (old regime) — cap ₹1.5 lakh combined."
    answer_type: number
    priority: medium
  - id: section_80d_self_premium
    prompt: "Health insurance premium paid for self/family?"
    why_it_matters: "Section 80D — up to ₹25k (under 60) or ₹50k (senior)."
    answer_type: number
    priority: medium
  - id: parents_are_seniors
    prompt: "Are your parents senior citizens (60+)?"
    why_it_matters: "Section 80D for parents — ₹25k (under 60) or ₹50k (senior)."
    answer_type: yes_no
    priority: low
  - id: home_loan_interest_self_occupied
    prompt: "Home loan interest paid on self-occupied property?"
    why_it_matters: "Section 24(b) deduction up to ₹2 lakh (old regime only)."
    answer_type: number
    priority: low
  - id: student_loan_interest_in
    prompt: "Education loan interest paid (Section 80E)?"
    why_it_matters: "Uncapped deduction for the first 8 years of repayment."
    answer_type: number
    priority: low
  - id: is_indian_citizen
    prompt: "Are you an Indian citizen?"
    why_it_matters: "Affects residency-test thresholds (Section 6) and deemed-residency rule."
    answer_type: yes_no
    priority: high
  - id: section_80ccd_1b_nps
    prompt: "How much did you contribute to NPS beyond your 80C limit (section 80CCD(1B))?"
    why_it_matters: "An extra deduction of up to Rs 50,000 over and above the Rs 1.5 lakh 80C ceiling (old regime)."
    answer_type: number
    priority: medium
  - id: section_80d_parents_premium
    prompt: "How much health-insurance premium did you pay for your parents?"
    why_it_matters: "Section 80D allows a separate deduction for parents' premium (higher cap if they are seniors)."
    answer_type: number
    priority: medium
  - id: section_80ddb_medical
    prompt: "Did you pay for treatment of a specified disease (self or dependant)? If so, how much?"
    why_it_matters: "Section 80DDB allows a deduction for specified-disease treatment (higher cap for seniors)."
    answer_type: number
    priority: low
  - id: section_80eeb_ev_loan_interest
    prompt: "Did you pay interest on an electric-vehicle loan? If so, how much?"
    why_it_matters: "Section 80EEB allows up to Rs 1,50,000 for EV-loan interest (old regime)."
    answer_type: number
    priority: low
  - id: section_80g_donations
    prompt: "How much did you donate to approved charities (section 80G)?"
    why_it_matters: "Section 80G allows a deduction (typically 50%) for eligible donations (old regime)."
    answer_type: number
    priority: low
  - id: section_80ggc_political_donation
    prompt: "Did you donate (non-cash) to a registered political party or electoral trust? If so, how much?"
    why_it_matters: "Section 80GGC allows a 100% deduction with no cap (old regime, non-cash mode)."
    answer_type: number
    priority: low
  - id: taxpayer_disability
    prompt: "Do you have a certified disability (section 80U)?"
    why_it_matters: "Section 80U gives a fixed deduction: Rs 75,000 (normal) or Rs 1,25,000 (severe)."
    answer_type: choice
    options: [none, normal, severe]
    priority: low
  - id: dependent_disability
    prompt: "Do you support a dependant with a certified disability (section 80DD)?"
    why_it_matters: "Section 80DD gives a fixed deduction: Rs 75,000 (normal) or Rs 1,25,000 (severe)."
    answer_type: choice
    options: [none, normal, severe]
    priority: low
  - id: section_80c_lic
    prompt: "How much did you pay in life-insurance premiums (LIC) this year?"
    why_it_matters: "Life-insurance premiums count toward the §80C deduction (₹1.5 lakh combined cap, old regime)."
    answer_type: number
    priority: medium
  - id: section_80c_epf
    prompt: "How much was your employee Provident Fund (EPF) contribution this year?"
    why_it_matters: "EPF contributions count toward the §80C deduction (₹1.5 lakh combined cap, old regime)."
    answer_type: number
    priority: medium
  - id: section_80c_home_loan_principal
    prompt: "How much home-loan principal did you repay this year?"
    why_it_matters: "Home-loan principal repayment counts toward the §80C deduction (₹1.5 lakh combined cap, old regime)."
    answer_type: number
    priority: medium
  - id: section_80c_elss
    prompt: "How much did you invest in ELSS (tax-saving mutual funds) this year?"
    why_it_matters: "ELSS investments count toward the §80C deduction (₹1.5 lakh combined cap, old regime)."
    answer_type: number
    priority: medium
  - id: section_80d_declared
    prompt: "What is your total §80D health-insurance premium (self, family and parents combined)?"
    why_it_matters: "Overrides the per-bucket §80D health-premium deduction with a single declared amount."
    answer_type: number
    priority: medium
  - id: years_since_first_80e
    prompt: "How many years has it been since you first claimed an education-loan interest deduction (§80E)?"
    why_it_matters: "The §80E deduction is only available for the first 8 years of repayment."
    answer_type: number
    priority: medium
  - id: professional_tax_paid
    prompt: "How much professional tax was deducted from your salary this year?"
    why_it_matters: "Professional tax is deductible under §16(iii), capped at ₹2,500."
    answer_type: number
    priority: medium
  - id: municipal_tax_paid
    prompt: "How much municipal (property) tax did you pay on a let-out property?"
    why_it_matters: "Municipal tax paid on a let-out property is deductible from house-property income."
    answer_type: number
    priority: medium
  - id: home_loan_interest_let_out
    prompt: "How much home-loan interest did you pay on a let-out property?"
    why_it_matters: "Interest on a let-out property is deductible under §24(b) (no ₹2 lakh cap on let-out)."
    answer_type: number
    priority: medium
  - id: section_80ccd_2_employer_nps
    prompt: "How much did your employer contribute to your NPS account (§80CCD(2))?"
    why_it_matters: "Employer NPS contributions are deductible under §80CCD(2) — allowed in the new regime too."
    answer_type: number
    priority: medium
  - id: salary_is_foreign
    prompt: "Was your salary income earned and received outside India?"
    why_it_matters: "Non-resident / RNOR filers can exclude foreign-sourced salary from Indian tax."
    answer_type: yes_no
    priority: low
