questions:
  - id: filing_status
    prompt: "What is your filing status?"
    why_it_matters: "Bracket thresholds, standard deduction, and many credit limits depend on filing status."
    answer_type: choice
    options: [single, married_filing_jointly, married_filing_separately, head_of_household, qualifying_surviving_spouse]
    priority: high
  - id: state_of_residence
    prompt: "Which US state were you a resident of for the year?"
    why_it_matters: "State income tax (or lack thereof) and state-specific credits."
    answer_type: text
    priority: high
  - id: city_of_residence
    prompt: "Which city did you live in (e.g. New York City, Yonkers)?"
    why_it_matters: "Some cities levy a local income tax — e.g. New York City resident tax and the Yonkers resident surcharge — on top of state tax."
    answer_type: text
    priority: medium
  - id: num_dependents
    prompt: "How many dependents will you claim?"
    why_it_matters: "Child Tax Credit, EITC, dependent care credit."
    answer_type: number
    priority: high
  - id: hsa_eligible
    prompt: "Were you covered by a High Deductible Health Plan and eligible for an HSA?"
    why_it_matters: "HSA contributions are above-the-line deductible and triple-tax-advantaged."
    answer_type: yes_no
    priority: medium
  - id: ira_401k_contributions
    prompt: "How much did you contribute to a 401(k) or IRA outside of W-2 box 12 codes?"
    why_it_matters: "Deductible traditional IRA contributions reduce AGI; Roth contributions affect phase-outs."
    answer_type: number
    priority: medium
  - id: taxpayer_age_65_or_older
    prompt: "Were you age 65 or older at the end of the tax year?"
    why_it_matters: "Adds an additional standard deduction amount on top of the base standard deduction."
    answer_type: yes_no
    priority: medium
  - id: taxpayer_blind
    prompt: "Were you blind at the end of the tax year?"
    why_it_matters: "Adds an additional standard deduction amount on top of the base standard deduction."
    answer_type: yes_no
    priority: medium
  - id: spouse_age_65_or_older
    prompt: "If married filing jointly, was your spouse age 65 or older at the end of the tax year?"
    why_it_matters: "Adds a further additional standard deduction amount for a 65+ spouse on a joint return."
    answer_type: yes_no
    priority: medium
  - id: spouse_blind
    prompt: "If married filing jointly, was your spouse blind at the end of the tax year?"
    why_it_matters: "Adds a further additional standard deduction amount for a blind spouse on a joint return."
    answer_type: yes_no
    priority: medium
  - id: foreign_accounts_over_10k
    prompt: "Did your foreign financial accounts exceed $10,000 USD aggregate at any time?"
    why_it_matters: "Triggers FBAR (FinCEN 114) and possibly FATCA Form 8938."
    answer_type: yes_no
    priority: high
  - id: itemize_or_standard
    prompt: "Do you expect itemized deductions to exceed the standard deduction?"
    why_it_matters: "Determines whether Schedule A is worth filing."
    answer_type: yes_no
    priority: low
  - id: state_taxes_paid
    prompt: "Approximately how much did you pay in state + local taxes during the year?"
    why_it_matters: "SALT deduction is capped at $10,000 on Schedule A."
    answer_type: number
    priority: low
  - id: state_local_property_tax
    prompt: "How much did you pay in real-estate property tax on your home/land this year (property tax only — NOT state income tax)?"
    why_it_matters: "The property-tax component of SALT on Schedule A; combined with state income tax it is capped at $10,000 (distinct from the state income tax in the previous question)."
    answer_type: number
    priority: medium
  - id: prior_capital_losses
    prompt: "How much in prior-year net capital losses are you carrying forward?"
    why_it_matters: "Offsets current capital gains; up to $3,000 can also offset ordinary income."
    answer_type: number
    priority: medium
  - id: hsa_contributions
    prompt: "How much did you contribute to your HSA during the year?"
    why_it_matters: "Above-the-line deduction; lowers AGI for nearly every credit threshold."
    answer_type: number
    priority: low
  - id: roth_conversion
    prompt: "Did you do a Roth conversion this year?"
    why_it_matters: "Adds taxable income now; pays no future tax on growth — bracket-management opportunity."
    answer_type: yes_no
    priority: low
  - id: residential_clean_energy_cost
    prompt: "Did you install solar, battery, wind, or geothermal at home? If so, what was the cost?"
    why_it_matters: "The §25D Residential Clean Energy Credit is 30% of the cost with no cap (Form 5695)."
    answer_type: number
    priority: medium
  - id: energy_efficient_improvements
    prompt: "Did you make energy-efficient home improvements (insulation, windows, doors)? If so, what was the cost?"
    why_it_matters: "The §25C credit is 30% of cost, capped at $1,200/year (Form 5695)."
    answer_type: number
    priority: low
  - id: heat_pump_cost
    prompt: "Did you install a heat pump, heat-pump water heater, or biomass stove? If so, what was the cost?"
    why_it_matters: "The §25C credit gives a separate $2,000/year cap for heat pumps (Form 5695)."
    answer_type: number
    priority: low
  - id: used_clean_vehicle_price
    prompt: "Did you buy a qualifying used clean vehicle (EV) from a dealer? If so, what was the sale price?"
    why_it_matters: "The §25E credit is the lesser of $4,000 or 30% of price (income limits apply; Form 8936)."
    answer_type: number
    priority: medium
  - id: foreign_source_income
    prompt: "Did you have foreign-source income taxed by another country? If so, how much (the taxable amount)?"
    why_it_matters: "Used with foreign tax paid for the Foreign Tax Credit's §904 limitation (Form 1116)."
    answer_type: number
    priority: medium
  - id: foreign_tax_paid
    prompt: "How much foreign income tax did you actually pay?"
    why_it_matters: "The Foreign Tax Credit offsets US tax for taxes paid to another country (Form 1116)."
    answer_type: number
    priority: medium
  - id: principal_residence_gain
    prompt: "Did you sell your main home at a gain this year? If so, what was the gain (already in your capital gains)?"
    why_it_matters: "§121 excludes up to $250,000 ($500,000 if married filing jointly) of gain on a principal residence."
    answer_type: number
    priority: medium
  - id: dependent_care_expenses
    prompt: "How much did you pay for child or dependent care so you could work (e.g. daycare, after-school care)?"
    why_it_matters: "Qualifying care expenses fund the Form 2441 Child & Dependent Care Credit (§21), a credit against your tax."
    answer_type: number
    priority: medium
  - id: num_dependent_care_persons
    prompt: "How many qualifying persons (children under 13, or a disabled spouse/dependent) did that care cover?"
    why_it_matters: "The §21 dependent-care credit caps eligible expenses at $3,000 for one qualifying person and $6,000 for two or more (Form 2441)."
    answer_type: number
    priority: medium
  - id: num_other_dependents
    prompt: "How many non-child dependents (e.g. parents, adult relatives) will you claim?"
    why_it_matters: "Each qualifying non-child dependent gives the $500 Credit for Other Dependents (ODC)."
    answer_type: number
    priority: medium
  - id: num_eitc_qualifying_children
    prompt: "How many qualifying children do you have for the Earned Income Tax Credit?"
    why_it_matters: "The EITC amount and phase-out depend on the number of qualifying children."
    answer_type: number
    priority: medium
  - id: taxpayer_age
    prompt: "How old were you at the end of the tax year?"
    why_it_matters: "Gates HSA 55+ and IRA 50+ catch-up contributions and the EITC 25-64 age requirement."
    answer_type: number
    priority: medium
  - id: hsa_coverage
    prompt: "Was your High Deductible Health Plan self-only or family coverage?"
    why_it_matters: "The HSA contribution cap is $4,150 for self-only vs $8,300 for family coverage."
    answer_type: choice
    options: [self, family]
    priority: medium
  - id: self_employed_health_insurance
    prompt: "How much did you pay in health insurance premiums as a self-employed person?"
    why_it_matters: "The §162(l) self-employed health insurance deduction is an above-the-line deduction."
    answer_type: number
    priority: medium
  - id: qualified_education_expense
    prompt: "How much did you pay in tuition or education expenses not already reported on a 1098-T?"
    why_it_matters: "Qualified education expenses fund the American Opportunity and Lifetime Learning credits."
    answer_type: number
    priority: medium
  - id: num_students
    prompt: "For how many students did you pay qualified education expenses?"
    why_it_matters: "Education credits (AOTC/LLC) are computed per student."
    answer_type: number
    priority: medium
  - id: aotc_eligible
    prompt: "Is the student in their first four years of post-secondary education and pursuing a degree?"
    why_it_matters: "Eligibility decides whether the more generous American Opportunity Credit (partly refundable) applies instead of the Lifetime Learning Credit."
    answer_type: yes_no
    priority: medium
  - id: spouse_earned_income
    prompt: "If married filing jointly, what was your spouse's earned income for the year?"
    why_it_matters: "Form 2441 limits the dependent-care credit to the lower of each spouse's earned income."
    answer_type: number
    priority: medium
