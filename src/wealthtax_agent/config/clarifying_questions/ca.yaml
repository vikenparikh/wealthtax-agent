questions:
  - id: marital_status
    prompt: "What is your marital status as of Dec 31 of the tax year?"
    why_it_matters: "Affects spousal credits, pension splitting, and many income-tested benefits."
    answer_type: choice
    options: [single, married, common_law, divorced, separated, widowed]
    priority: high
  - id: province_of_residence
    prompt: "Which province or territory did you live in on Dec 31 of the tax year?"
    why_it_matters: "Provincial tax + non-refundable credits depend on province of residence."
    answer_type: choice
    options: ["ON", "BC", "AB", "QC", "NS", "NB", "MB", "SK", "PE", "NL", "YT", "NT", "NU"]
    priority: high
  - id: foreign_property_over_100k
    prompt: "Did you own foreign property with total cost over $100,000 CAD at any time?"
    why_it_matters: "Triggers a T1135 Foreign Income Verification Statement (separate filing)."
    answer_type: yes_no
    priority: high
  - id: taxpayer_age_65_or_older
    prompt: "Were you age 65 or older at the end of the tax year?"
    why_it_matters: "Unlocks the federal age amount credit (line 30100) and RRIF pension-income eligibility."
    answer_type: yes_no
    priority: medium
  - id: is_us_person
    prompt: "Are you a US citizen or green card holder?"
    why_it_matters: "Triggers US tax filing obligations regardless of residence; affects TFSA usefulness."
    answer_type: yes_no
    priority: medium
  - id: rrsp_room_remaining
    prompt: "What is your remaining RRSP contribution room (from your latest CRA Notice of Assessment)?"
    why_it_matters: "Bounds RRSP contributions / suggested top-ups; over-contribution penalty applies."
    answer_type: number
    priority: medium
  - id: dependents
    prompt: "Do you have eligible dependants (children under 18, or supported relatives)?"
    why_it_matters: "Drives Canada Child Benefit and several non-refundable credits."
    answer_type: yes_no
    priority: medium
  - id: spouse_income
    prompt: "If married/common-law, what was your spouse's net income for the year?"
    why_it_matters: "Determines spousal amount, pension splitting eligibility, and benefit clawbacks."
    answer_type: number
    priority: low
  - id: home_buyer_first
    prompt: "Did you buy your first home in this tax year?"
    why_it_matters: "Unlocks the First-Time Home Buyers' Tax Credit and HBP withdrawals."
    answer_type: yes_no
    priority: low
  - id: prior_capital_losses
    prompt: "How much in prior-year net capital losses are you carrying forward?"
    why_it_matters: "Offsets this year's taxable capital gains before the 50% inclusion rate."
    answer_type: number
    priority: medium
  - id: tuition_carryforward
    prompt: "Any unused tuition / education credits carried forward from prior years?"
    why_it_matters: "Reduces federal + provincial tax; can be transferred up to $5,000 to a supporting relative."
    answer_type: number
    priority: low
  - id: fhsa_room_remaining
    prompt: "What is your remaining FHSA contribution room?"
    why_it_matters: "First Home Savings Account: deductible like RRSP, withdrawals for first home are tax-free."
    answer_type: number
    priority: low
  - id: t1135_foreign_property_value
    prompt: "If foreign property is over $100k CAD, what is its peak cost during the year?"
    why_it_matters: "Determines whether the full or simplified T1135 reporting method applies."
    answer_type: number
    priority: low
  - id: home_buyers_amount
    prompt: "If you bought your first home this year, how much of the $10,000 Home Buyers' Amount are you claiming?"
    why_it_matters: "A first-time home buyer gets a 15% non-refundable credit on up to $10,000 (line 31270, max $1,500)."
    answer_type: number
    priority: medium
  - id: medical_expenses
    prompt: "What total medical expenses (receipts only — never on a slip) did you pay this year for yourself and your family?"
    why_it_matters: "The Medical Expense Tax Credit (line 33099) gives a 15% non-refundable credit on costs exceeding the lesser of 3% of net income or ~$2,759."
    answer_type: number
    priority: medium
  - id: mhrtc_qualifying_expenditure
    prompt: "Did you build a secondary suite for a senior or disabled relative? If so, what were the eligible renovation costs?"
    why_it_matters: "The Multigenerational Home Renovation Tax Credit refunds 15% of up to $50,000 (line 45355, max $7,500)."
    answer_type: number
    priority: medium
  - id: security_option_benefit
    prompt: "Did you exercise employee stock options this year? If so, what was the taxable benefit (T4 box 38)?"
    why_it_matters: "Half of a qualifying stock-option benefit is deductible (security options deduction, line 24900)."
    answer_type: number
    priority: medium
  - id: volunteer_firefighter_amount
    prompt: "Were you a volunteer firefighter with 200+ eligible hours? If so, enter $3,000 to claim the amount."
    why_it_matters: "The Volunteer Firefighters' Amount is a $3,000 fixed amount -> $450 credit (line 31220)."
    answer_type: number
    priority: low
  - id: search_rescue_volunteer_amount
    prompt: "Were you a search-and-rescue volunteer with 200+ eligible hours (and not claiming the firefighter amount)? If so, enter $3,000."
    why_it_matters: "The Search and Rescue Volunteers' Amount is a $3,000 fixed amount -> $450 credit (line 31240); you may claim it OR the firefighter amount, not both."
    answer_type: number
    priority: low
