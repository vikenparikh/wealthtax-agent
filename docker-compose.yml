version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wealthtax
      POSTGRES_PASSWORD: wealthtax
      POSTGRES_DB: wealthtax
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthtax"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://wealthtax:wealthtax@db:5432/wealthtax"
      WEALTHTAX_FERNET_KEY: "${WEALTHTAX_FERNET_KEY}"
      WEALTHTAX_MODE: "saas"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      LOG_LEVEL: "INFO"
      SESSION_TTL_MINUTES: "1440"
      CORRECTION_RATE_PER_MINUTE: "30"
    ports:
      - "8501:8501"

volumes:
  db_data: {}
