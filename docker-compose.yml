version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wealthtax
      POSTGRES_PASSWORD: wealthtax
      POSTGRES_DB: wealthtax
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthtax"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://wealthtax:wealthtax@db:5432/wealthtax"
      WEALTHTAX_FERNET_KEY: "${WEALTHTAX_FERNET_KEY}"
      WEALTHTAX_MODE: "saas"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      LOG_LEVEL: "INFO"
      SESSION_TTL_MINUTES: "1440"
      CORRECTION_RATE_PER_MINUTE: "30"
    ports:
      - "8501:8501"

  healthz:
    build: .
    command: >
      .venv/bin/uvicorn wealthtax_agent.healthz:app
      --host 0.0.0.0 --port 8502 --workers 1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://wealthtax:wealthtax@db:5432/wealthtax"
      WEALTHTAX_FERNET_KEY: "${WEALTHTAX_FERNET_KEY}"
      WEALTHTAX_MODE: "saas"
      GROQ_API_KEY: "${GROQ_API_KEY}"
    ports:
      - "8502:8502"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8502/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: {}
