[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --cov=wealthtax_agent --cov-report=term-missing

filterwarnings =
	ignore:.*SwigPy.*has no __module__ attribute:DeprecationWarning
	ignore:.*swigvarlink has no __module__ attribute:DeprecationWarning
