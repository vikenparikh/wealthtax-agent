# PR test-gate — first CI for this repo.
#
# Why: this is money-adjacent code (multi-jurisdiction tax logic). Without CI,
# `main`'s health is unknown and PRs merge blind. This workflow runs the offline
# unit suite (tests/unit) on every PR and every push to main so a red test blocks
# the merge signal.
#
# Scope: tests/unit only. Verified locally on clean main to run fully offline
# (no network / no live DB / no secrets) — 1438 passed, 2 skipped in ~22s.
# Broader suites (integration/e2e) are intentionally NOT run here; they may need
# external services and are out of scope for this first gate.
#
# Install: pyproject.toml has no [project.dependencies], so runtime deps live in
# requirements.txt and the package uses a src/ layout. CI therefore installs
# requirements.txt AND the package editable (pip install -e .) to match the
# local green setup exactly.
#
# Note: this is not wired as a required check — the operator can make it required
# via branch protection when they choose.

name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: python -m pytest tests/unit -p no:cacheprovider -q -o addopts=""
